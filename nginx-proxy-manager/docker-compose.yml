services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm
    restart: always
    ports:
      - '80:80'
      - '443:443'
      - '81:81' # UI Panel port
    networks:
      - my_internal_network
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
networks:
  my_internal_network:
    external: true