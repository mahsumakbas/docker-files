services:
  jenkins:
    image: jenkins/jenkins:2.541.3-jdk21
    container_name: jenkins
    restart: always
    ports:
      - '8080:8080'
      - '50000:50000'
    volumes:
      - /var/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Etc/UTC
    networks:
      - my_internal_network
networks:
  my_internal_network:
    external: true